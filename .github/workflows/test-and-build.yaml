name: Testing and Building my app
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: getting my code first
        uses: actions/checkout@v6

      - name: installing node
        uses: actions/setup-node@v6
        with:
            node-version: '22'

      - name: installing dependencies
        run: npm install

      - name: testing app
        run: npm test

      
      
