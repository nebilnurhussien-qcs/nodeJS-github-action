name: Testing and Building my app
#on: ['push','workflow_dispatch'] #Allows multiple events to trigger workflow
on:
  pull_request:
    types: [opened,closed]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: getting my code first
        uses: actions/checkout@v6

      - name: installing node
        uses: actions/setup-node@v6
        with:
            node-version: '22'

      - name: installing dependencies
        run: npm install

      - name: testing app
        run: npm test

  build:
    needs: test #Sequential where this step won't run if test fails 
    runs-on: ubuntu-latest
    steps:
      - name: getting my code first
        uses: actions/checkout@v6

      - name: installing node
        uses: actions/setup-node@v6
        with:
            node-version: '22'

      - name: installing dependencies
        run: npm install

      - name: start my app
        run: npm run build

        
    

      
      
